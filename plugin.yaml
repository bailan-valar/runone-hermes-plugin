name: runone-platform
label: RunOne
kind: platform
version: 0.1.0
description: >
  RunOne gateway adapter for Hermes Agent (draft for docs/ai-channel-design.md).
  RunOne acts as a chat platform: Hermes polls the RunOne API outbound
  (long-poll /ai/inbox) and writes replies back (/ai/messages/:id/reply).
  No inbound exposure, no tunnel — RunOne's own API stays the only surface.
author: RunOne
requires_env:
  - name: RUNONE_BASE_URL
    description: "RunOne API base URL (no trailing slash). Production: https://runone-api.capdien.site ; local dev: http://127.0.0.1:8787"
    secret: false
  - name: RUNONE_TOKEN
    description: "RunOne personal access token (rn_…) used by Hermes — create it in RunOne 设置 → 个人访问令牌"
    secret: true
    url: "https://project.capdien.site/settings"
optional_env:
  - name: RUNONE_HOME_CONVERSATION
    description: "Default conversation id for cron / notification delivery"
    secret: false
  - name: RUNONE_ALLOWED_USERS
    description: "Comma-separated RunOne account ids allowed to talk to the agent"
    secret: false
  - name: RUNONE_ALLOW_ALL_USERS
    description: "Allow any RunOne account (dev only — disables the allowlist)"
    secret: false
